name: Refresh submarket data
on:
  schedule:
    - cron: "0 16 16 * *"   # 16th of each month, 9am PT — after Zillow's mid-month update
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build submarkets.json
        run: python build_data.py
      - name: Commit if changed
        run: |
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add submarkets.json
          git diff --cached --quiet || git commit -m "Data refresh $(date +%F)"
          git push
